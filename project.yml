name: Gnotchi
options:
  bundleIdPrefix: dev.mwlr
  deploymentTarget:
    macOS: "27.0"
  developmentLanguage: de
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: "1"

# Genau EINE Paket-Abhängigkeit: Sparkle für Updates (docs/SECURE-DESIGN.md G11, gleiche
# Vorlage wie Kalli/Seam). `exactVersion` statt `from:` und `Package.resolved` im Repo:
# Bei einem Updater darf nicht der Auflösungszeitpunkt entscheiden, welche Fassung
# ausgeliefert wird. Der Medien-Adapter ist kein Paket, sondern eingespielter Quelltext (Vendor/).
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

targets:
  Gnotchi:
    type: application
    platform: macOS
    sources:
      - path: Gnotchi
      # Perl-Skript des Medien-Adapters nach Contents/Resources. Als Quelle mit
      # buildPhase, weil XcodeGen den Schlüssel `resources:` nicht kennt.
      - path: Vendor/mediaremote-adapter/bin/mediaremote-adapter.pl
        buildPhase: resources
    resources:
      - path: Gnotchi/Resources/HILFE.md
      - path: Gnotchi/Resources/CHANGELOG.md
      - path: Gnotchi/Resources/THIRD-PARTY-LICENSES.md
      - path: Gnotchi/Resources/PlusJakartaSans-Variable.ttf
    dependencies:
      - package: Sparkle
        product: Sparkle
      - target: MediaRemoteAdapter
        embed: true
        link: false
        codeSign: true
      - target: MediaRemoteAdapterTestClient
        embed: true
        link: false
        codeSign: true
        copy:
          destination: executables
      # Hilfsprogramm für Mitteilungen (0.6.0, docs/SECURE-DESIGN.md G28): eigenes Paket mit eigener Kennung,
      # damit die Bedienungshilfen-Freigabe dort liegt und Gnotchi ohne bleibt (G1).
      - target: GnotchiMitteilungen
        embed: true
        link: false
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LoginItems
      # Hook-Programm für Claude Code (0.9.0, docs/SECURE-DESIGN.md G34): eigenes Paket, eigene Kennung, damit
      # Gnotchi den Absender am Socket prüfen kann. Wird von Claude Code je Ereignis kurz gestartet.
      - target: GnotchiClaude
        embed: true
        link: false
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        INFOPLIST_FILE: Gnotchi/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.mwlr.gnotchi
        CODE_SIGN_ENTITLEMENTS: Gnotchi/Resources/Gnotchi.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # Ebenen-Symbol aus Icon Composer (Gnocchi-Notch + Pegel, 18.10.). Liegt unter
        # Gnotchi/Resources/AppIcon.icon und kommt über `sources: Gnotchi` ins Bundle.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        # 0.8.0 (G32): ZIP der Ablage im Prozess über die System-Bibliothek libarchive (SDK: libarchive.tbd, kein
        # Header → eigene Deklarationen im Bridging-Header). Kein Kindprozess (G3), Passwort nie als Argument.
        SWIFT_OBJC_BRIDGING_HEADER: Gnotchi/Shelf/Gnotchi-Bridging-Header.h
        OTHER_LDFLAGS: "$(inherited) -larchive"

  # „Gnotchi Mitteilungen“ (0.6.0, SECURE-DESIGN G28): EINZIGES Ziel mit Bedienungshilfen-Code. Liest Apples
  # Mitteilungsbanner, versteckt sie und löst auf Klick in Gnotchi eine gemeldete Aktion aus. Keine Berechtigungen
  # (Entitlements): Bedienungshilfen sind keine, der Nutzer erteilt sie in den Systemeinstellungen. Das
  # Nachrichtenformat ist dieselbe Datei wie in Gnotchi (NotifyWire), damit Senden und Prüfen nie auseinanderlaufen.
  GnotchiMitteilungen:
    type: application
    platform: macOS
    sources:
      - path: GnotchiMitteilungen
        excludes:
          - Info.plist
      - path: Gnotchi/Notify/NotifyWire.swift
      - path: Gnotchi/Media/LiveText.swift
      - path: Gnotchi/Resources/AppIcon.icon
    settings:
      base:
        PRODUCT_NAME: Gnotchi Mitteilungen
        INFOPLIST_FILE: GnotchiMitteilungen/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.mwlr.gnotchi.mitteilungen
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

  # Hook-Programm „Gnotchi Claude“ (0.9.0, G34): liest die Hook-Eingabe von Claude Code, meldet Gnotchi einen
  # bereinigten Status über den geprüften Socket `claude.sock` und endet. Nie eine Entscheidung an Claude Code,
  # keine Berechtigungen. Nachrichtenformat = dieselbe Datei wie in Gnotchi (ClaudeWire).
  GnotchiClaude:
    type: application
    platform: macOS
    sources:
      - path: GnotchiClaude
        excludes:
          - Info.plist
      - path: Gnotchi/Claude/ClaudeWire.swift
      - path: Gnotchi/Notify/NotifyWire.swift
      - path: Gnotchi/Media/LiveText.swift
    settings:
      base:
        PRODUCT_NAME: Gnotchi Claude
        INFOPLIST_FILE: GnotchiClaude/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.mwlr.gnotchi.claude
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

  # Prüft reine Logik (Zeilen schneiden, Adapter-Zeile bereinigen, Cover-Grenzen, Signaturprüfung,
  # Argumente des Kindprozesses). Die App erkennt den Testlauf und startet dann weder Sparkle
  # noch den Adapter (GnotchiApp).
  GnotchiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GnotchiTests
    dependencies:
      - target: Gnotchi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTABILITY: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.mwlr.gnotchi.tests

  # Medien-Adapter (Vendor/, BSD-3). Gnotchi lädt dieses Framework NIE selbst:
  # /usr/bin/perl lädt es als Kindprozess (docs/SECURE-DESIGN.md G2). Deshalb
  # eingebettet, aber nicht gelinkt.
  MediaRemoteAdapter:
    type: framework
    platform: macOS
    sources:
      - path: Vendor/mediaremote-adapter/src/adapter
      - path: Vendor/mediaremote-adapter/src/private
      - path: Vendor/mediaremote-adapter/src/utility
      - path: Vendor/mediaremote-adapter/include
        buildPhase: headers
        headerVisibility: public
    dependencies:
      - sdk: Foundation.framework
      - sdk: AppKit.framework
      - sdk: UniformTypeIdentifiers.framework
    settings:
      base:
        PRODUCT_NAME: MediaRemoteAdapter
        PRODUCT_BUNDLE_IDENTIFIER: dev.mwlr.gnotchi.mediaremoteadapter
        GENERATE_INFOPLIST_FILE: YES
        CLANG_ENABLE_OBJC_ARC: YES
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/mediaremote-adapter/src $(SRCROOT)/Vendor/mediaremote-adapter/include"
        OTHER_CFLAGS: "-fvisibility=default"
        DEFINES_MODULE: NO
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: NO
        # Fremdcode bleibt unverändert; seine ~40 Warnungen würden echte Gnotchi-Warnungen verdecken.
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES

  # Abhängigkeiten wie in Upstreams CMakeLists.txt (nicht eingespielt): Foundation + MediaPlayer.
  MediaRemoteAdapterTestClient:
    type: tool
    platform: macOS
    sources:
      - path: Vendor/mediaremote-adapter/src/test
    dependencies:
      - sdk: Foundation.framework
      - sdk: MediaPlayer.framework
    settings:
      base:
        PRODUCT_NAME: MediaRemoteAdapterTestClient
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.mwlr.gnotchi.mediaremoteadapter.testclient
        CLANG_ENABLE_OBJC_ARC: YES
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/mediaremote-adapter/src $(SRCROOT)/Vendor/mediaremote-adapter/include"
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
